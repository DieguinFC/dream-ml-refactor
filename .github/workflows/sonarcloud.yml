name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - init-refactor-documents
  pull_request:
    branches:
      - init-refactor-documents
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: DREAM-ML-backend/GEML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-base.txt -r requirements-dev.txt

      - name: Run backend tests with coverage
        id: backend_tests
        working-directory: DREAM-ML-backend/GEML
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 45m \
          python -m coverage run \
            --source=api,apiTimeSeries \
            -m pytest \
            tests/api_tests \
            tests/apiTimeSeries_tests \
            -ra \
            -vv \
            --durations=30 \
            --junitxml=test-results.xml
          test_status=$?

          coverage_xml_status=0
          python -m coverage xml -o coverage.xml || coverage_xml_status=$?

          coverage_report_status=0
          python -m coverage report > coverage-report.txt 2>&1 || coverage_report_status=$?

          if [ "$test_status" -eq 124 ] || [ "$test_status" -eq 137 ] || [ "$test_status" -eq 143 ]; then
            test_status_message="Tests terminated by the 45-minute timeout."
          elif [ "$test_status" -eq 0 ]; then
            test_status_message="All backend tests passed."
          else
            test_status_message="Backend tests failed with exit code ${test_status}."
          fi

          {
            echo "Test status: ${test_status}"
            echo "${test_status_message}"
            echo "Coverage XML status: ${coverage_xml_status}"
            echo "Coverage report status: ${coverage_report_status}"
          } > test-status.txt

          {
            echo "## Backend test and coverage results"
            echo ""
            echo "- Pytest step: \`${test_status}\`"
            echo "- ${test_status_message}"
            echo "- Coverage XML step: \`${coverage_xml_status}\`"
            echo "- Coverage report step: \`${coverage_report_status}\`"
            echo ""
            echo '```text'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          if-no-files-found: warn
          path: |
            DREAM-ML-backend/GEML/test-results.xml
            DREAM-ML-backend/GEML/coverage.xml
            DREAM-ML-backend/GEML/coverage-report.txt
            DREAM-ML-backend/GEML/test-status.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: DREAM-ML-frontend/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: DREAM-ML-frontend/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: DREAM-ML-frontend/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: DREAM-ML-frontend/frontend
        run: npm run build

      - name: Validate SonarCloud configuration
        if: ${{ github.event_name == 'push' || env.SONAR_TOKEN != '' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is required for pushes to main."
            exit 1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Configure the SONAR_ORGANIZATION repository variable."
            exit 1
          fi

      - name: SonarCloud Scan
        if: ${{ github.event_name == 'push' || env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
