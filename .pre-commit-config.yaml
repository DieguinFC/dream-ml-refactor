# Local checks that run before each commit. Install once per clone:
#   pre-commit install
# Formatters (Ruff, ESLint, Prettier) are deliberately left out: reformatting
# files of thousands of lines would hide real changes. Linting runs in CI.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^Docs/baseline/

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, docs, ci, build, chore, perf, revert]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: block-artifacts
        name: Block generated artifacts
        language: fail
        entry: Generated artifact must not be committed
        files: (^|/)(\.coverage|coverage\.(xml|json)|test-results\.xml|db\.sqlite3|\.DS_Store)$|,cover$|\.pyc$|(^|/)htmlcov/
        exclude: ^Docs/baseline/
